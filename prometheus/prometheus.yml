# Prometheus — um job para cada aplicação e cada exporter (R4).
# Todos os alvos são acessados pelo nome do serviço na rede interna do Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    ambiente: lab

scrape_configs:
  # O próprio Prometheus
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ---------------- Aplicações do Projeto Integrador ----------------
  # O Actuator roda na porta de gerenciamento 8081 (não publicada na internet).
  - job_name: app-pedidos
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-pedidos:8081"]
        labels:
          camada: aplicacao

  - job_name: app-estoque
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["app-estoque:8081"]
        labels:
          camada: aplicacao

  # ---------------- Infraestrutura ----------------
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          camada: infraestrutura

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          camada: infraestrutura

  - job_name: postgres-exporter
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          camada: infraestrutura

  # ---------------- Stack de observabilidade ----------------
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          camada: observabilidade

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          camada: observabilidade

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          camada: observabilidade
