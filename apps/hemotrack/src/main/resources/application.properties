spring.application.name=hemotrack

# ---------------------------------------------------------------------------------------------
# Banco H2 gravado em ARQUIVO, numa pasta fixa dentro da pasta do usuario do sistema:
#   Windows: C:\Users\<voce>\hemotrack-dados\hemotrack.mv.db
#   Linux/Mac: ~/hemotrack-dados/hemotrack.mv.db
# Antes o caminho era relativo (./data), e por isso dependia da pasta de onde o VS Code
# iniciava a aplicacao: rodando de outra pasta (ou de uma copia nova do projeto) o sistema
# abria um banco vazio e as contas criadas "sumiam". Agora o banco e sempre o mesmo.
# Para usar outro local, defina a variavel de ambiente HEMOTRACK_DB (ex.: C:/dados/hemotrack).
# ---------------------------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:${HEMOTRACK_DB:${user.home}/hemotrack-dados/hemotrack}
spring.datasource.username=sa
spring.datasource.password=
# "update" so cria/ajusta as tabelas; NUNCA apaga os dados existentes.
spring.jpa.hibernate.ddl-auto=update

# Console do banco em http://localhost:8080/h2-console (so abre depois de entrar na plataforma).
# Use a mesma JDBC URL exibida no log ao iniciar a aplicacao, usuario "sa" e senha em branco.
spring.h2.console.enabled=true

# US10: verificacao automatica de validade, todo dia as 00:05 (a validade muda por dia)
hemotrack.validade.cron=0 5 0 * * *

# Carrega dados de demonstracao quando o banco esta vazio (sem hospitais). Use false para comecar
# sem dados (so os usuarios sao criados); assim a primeira requisicao recebe o identificador REQ-0001.
# Atencao: com o banco ja preenchido, mudar para false NAO apaga nada; apague a pasta hemotrack-dados
# (ou aponte HEMOTRACK_DB para outro local) para comecar do zero.
hemotrack.dados-demo=true

# =============================================================================================
# Observabilidade (Projeto de Avaliacao - Infraestrutura de Comunicacao)
# =============================================================================================
# O Actuator roda numa porta de gerenciamento separada (8081), que NAO e publicada para a
# internet: so o Prometheus (rede interna do Docker) a acessa. (R5)
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.info.java.enabled=true
# R1: tag usada nos filtros do Grafana em TODAS as metricas
management.metrics.tags.application=${spring.application.name}
# Histogramas para calcular p95/p99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hemotrack.alocacao.tempo=true
# R6: traces enviados ao Tempo via OTLP/HTTP (100% das requisicoes, ambiente de laboratorio)
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
# Spans de banco: so as consultas (QUERY) e a leitura dos resultados (FETCH).
# O span de CONEXAO fica desligado porque o HemoTrack usa open-in-view (padrao do Spring):
# a conexao vive ate o fim da requisicao, depois do span do servico, e isso fazia o contexto
# do trace "vazar" para a proxima requisicao da mesma thread (um traceId para sempre).
jdbc.includes=QUERY,FETCH
# R6: endereco do Loki usado pelo logback-spring.xml
loki.url=${LOKI_URL:http://localhost:3100/loki/api/v1/push}

info.app.name=${spring.application.name}
info.app.description=HemoTrack - gestao inteligente de hemocomponentes
info.app.version=1.0.0
